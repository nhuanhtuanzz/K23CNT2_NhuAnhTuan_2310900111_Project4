<!DOCTYPE html>
<html lang="vi"
      xmlns:th="http://www.thymeleaf.org">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Admin Dashboard</title>

    <link rel="stylesheet"
          th:href="@{/css/admin-dashboard.css}">

    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

</head>

<body>

<th:block th:with="activeMenu='dashboard'">

    <div class="dashboard-container">

        <!-- SIDEBAR -->
        <div th:replace="~{Admin/layout/sidebar :: sidebar}"></div>

        <!-- MAIN -->
        <div class="main-wrapper">

            <!-- NAVBAR -->
            <div th:replace="~{Admin/layout/navbar :: navbar}"></div>

            <!-- CONTENT -->
            <main class="main-content">

                <!-- HEADER -->
                <div class="content-header">

                    <h1>Tổng quan hệ thống</h1>

                </div>

                <!-- STATS -->
                <div class="stats-grid">

                    <!-- TOTAL ORDERS -->
                    <div class="stat-card">

                        <div class="stat-icon">
                            <i class="fa-solid fa-bag-shopping"></i>
                        </div>

                        <div class="stat-info">

                            <h3>Tổng đơn hàng</h3>

                            <p th:text="${stats.totalOrders}">
                                0
                            </p>

                        </div>

                    </div>

                    <!-- REVENUE -->
                    <div class="stat-card">

                        <div class="stat-icon">
                            <i class="fa-solid fa-wallet"></i>
                        </div>

                        <div class="stat-info">

                            <h3>Doanh thu</h3>

                            <p th:text="${#numbers.formatDecimal(stats.totalRevenue, 0, 'COMMA', 0, 'POINT')} + ' đ'">
                                0 đ
                            </p>

                        </div>

                    </div>

                    <!-- NEW CUSTOMERS -->
                    <div class="stat-card">

                        <div class="stat-icon">
                            <i class="fa-solid fa-user-plus"></i>
                        </div>

                        <div class="stat-info">

                            <h3>Khách hàng mới</h3>

                            <p th:text="${stats.newCustomers}">
                                0
                            </p>

                        </div>

                    </div>

                </div>

                <!-- RECENT ORDERS -->
                <div class="table-container">

                    <h3>Đơn hàng gần đây</h3>

                    <table class="data-table">

                        <thead>

                        <tr>

                            <th>Mã đơn</th>

                            <th>Khách hàng</th>

                            <th>Tổng tiền</th>

                            <th>Trạng thái</th>

                            <th>Hành động</th>

                        </tr>

                        </thead>

                        <tbody>

                        <tr th:each="order : ${recentOrders}">

                            <!-- ORDER ID -->
                            <td th:text="${order.orderId}"></td>

                            <!-- CUSTOMER -->
                            <td th:text="${order.customerName}"></td>

                            <!-- AMOUNT -->
                            <td th:text="${#numbers.formatDecimal(order.amount, 0, 'COMMA', 0, 'POINT')} + ' đ'"></td>

                            <!-- STATUS -->
                            <td>

                                <span class="badge"

                                      th:classappend="
                                      ${order.status == 'Hoàn thành'}
                                      ? 'badge-success'
                                      : (${order.status == 'Đang pha chế'}
                                      ? 'badge-warning'
                                      : 'badge-info')"

                                      th:text="${order.status}">

                                </span>

                            </td>

                            <!-- ACTION -->
                            <td>

                                <button class="action-btn">

                                    <i class="fa-solid fa-eye"></i>
                                    Chi tiết

                                </button>

                            </td>

                        </tr>

                        </tbody>

                    </table>

                </div>

                <!-- QUICK ACTION -->
                <div class="table-container"
                     style="margin-top: 30px;">

                    <h3>Thao tác nhanh</h3>

                    <div class="quick-actions">

                        <a th:href="@{/admin/products}"
                           class="quick-btn">

                            <i class="fa-solid fa-box"></i>
                            Quản lý sản phẩm

                        </a>

                        <a href="#"
                           class="quick-btn">

                            <i class="fa-solid fa-users"></i>
                            Quản lý người dùng

                        </a>

                        <a href="#"
                           class="quick-btn">

                            <i class="fa-solid fa-receipt"></i>
                            Quản lý đơn hàng

                        </a>

                    </div>

                </div>

            </main>

        </div>

    </div>

</th:block>

<script th:src="@{/js/admin-dashboard.js}"></script>

</body>

</html>
