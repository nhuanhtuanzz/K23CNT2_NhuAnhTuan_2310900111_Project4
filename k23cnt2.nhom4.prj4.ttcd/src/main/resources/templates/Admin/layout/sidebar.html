<!DOCTYPE html>
<html lang="vi"
      xmlns:th="http://www.thymeleaf.org">

<body>

<div th:fragment="sidebar">

    <aside class="sidebar">

        <div class="sidebar-brand">
            <h2>
                <i class="fa-solid fa-mug-hot"></i>
                T&C Admin
            </h2>
        </div>

        <ul class="sidebar-menu">

            <li>
                <a th:href="@{/admin-dashboard}"
                   th:classappend="${activeMenu == 'dashboard'} ? 'active'">

                    <i class="fa-solid fa-chart-pie"></i>
                    Dashboard
                </a>
            </li>
            <li>

                <a href="#"
                   onclick="toggleProductMenu()">

                    <i class="fa-solid fa-box"></i>

                    <span>Quản lý sản phẩm</span>

                    <i class="fa-solid fa-chevron-down"></i>

                </a>

                <ul id="productSubmenu"
                    class="submenu"

                    th:classappend="
            ${activeMenu=='products'}
            or ${activeMenu=='category'}
            or ${activeMenu=='variant'}
            or ${activeMenu=='option'}
            ? 'show'">

                    <li>
                        <a th:href="@{/admin/categories}"
                           th:classappend="${activeMenu=='category'} ? 'active'">

                            Danh mục
                        </a>
                    </li>

                    <li>
                        <a th:href="@{/admin/products}"
                           th:classappend="${activeMenu=='products'} ? 'active'">

                            Sản phẩm
                        </a>
                    </li>

                    <li>
                        <a th:href="@{/admin/variants}"
                           th:classappend="${activeMenu=='variant'} ? 'active'">

                            Kích cỡ
                        </a>
                    </li>

                    <li>
                        <a th:href="@{/admin/options}"
                           th:classappend="${activeMenu=='option'} ? 'active'">

                            Tùy chọn
                        </a>
                    </li>

                </ul>

            </li>
            <li>
                <a th:href="@{/admin/users}"
                   th:classappend="${activeMenu == 'users'} ? 'active'">

                    <i class="fa-solid fa-users"></i>
                    Người dùng

                </a>
            </li>
            <li>
                <a th:href="@{/admin/orders}"
                   th:classappend="${activeMenu == 'orders'} ? 'active'">

                    <i class="fa-solid fa-receipt"></i>
                    Đơn hàng

                </a>
        </ul>

    </aside>

</div>

</body>
</html>
